<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Билет яратиш · Бухоро</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext" rel="stylesheet">
<style>
  :root {
    --lapis: #1D3F7A;
    --lapis-deep: #142C57;
    --turq: #3FA9A3;
    --brick: #C9A06B;
    --ink: #1A2238;
    --paper: #F5F7FA;
    --line: #D6DCE6;
    --muted: #5B6478;
    --ok: #2F7D5B;
    --warn: #9A5B12;
    --err: #A63A3A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 400 16px/1.5 "Golos Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 32px 16px 48px;
    display: grid;
    grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
    gap: 48px;
    align-items: start;
  }
  header.top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header.top h1 { font: 700 26px/1.15 "Unbounded", system-ui, sans-serif; margin: 0; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--muted); }
  .counter { color: var(--muted); font-size: 15px; }
  .counter b { color: var(--ink); font-weight: 600; }

  form { display: grid; gap: 20px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; }
  .field input {
    width: 100%;
    font: 500 20px/1.2 "Golos Text", system-ui, sans-serif;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 14px 14px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--lapis); box-shadow: 0 0 0 3px rgba(29,63,122,.15); }
  .phone { display: flex; align-items: stretch; }
  .phone span {
    display: grid; place-items: center;
    padding: 0 12px;
    font: 500 20px/1 "Golos Text", system-ui, sans-serif;
    background: #E9EDF4; border: 1.5px solid var(--line); border-right: 0;
    border-radius: 10px 0 0 10px; color: var(--muted);
  }
  .phone input { border-radius: 0 10px 10px 0; }
  .hint { color: var(--muted); font-size: 14px; margin-top: 6px; }

  button {
    font: 600 17px/1 "Golos Text", system-ui, sans-serif;
    border-radius: 10px;
    padding: 16px 20px;
    cursor: pointer;
    border: 1.5px solid transparent;
  }
  button:focus-visible { outline: 3px solid var(--turq); outline-offset: 2px; }
  button[disabled] { opacity: .55; cursor: progress; }
  .primary { background: var(--lapis); color: #fff; width: 100%; }
  .primary:hover:not([disabled]) { background: var(--lapis-deep); }
  .ghost { background: #fff; color: var(--ink); border-color: var(--line); }
  .ghost:hover { border-color: var(--lapis); }

  .status { min-height: 24px; font-weight: 500; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .status.err { color: var(--err); }

  .actions { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
  .actions.show { display: grid; }
  .actions .wide { grid-column: 1 / -1; }

  .preview { position: sticky; top: 24px; }
  .preview canvas {
    width: 100%; max-width: 480px; height: auto; display: block; margin: 0 auto;
    border-radius: 14px;
    box-shadow: 0 24px 48px -24px rgba(20,44,87,.55);
  }

  .log { margin-top: 8px; }
  .log h2 { font: 600 16px/1.3 "Golos Text", system-ui, sans-serif; margin: 0 0 8px; }
  .log ol { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line); }
  .log li { border-bottom: 1px solid var(--line); }
  .log button {
    width: 100%; background: none; border: 0; border-radius: 0; padding: 10px 2px;
    display: flex; justify-content: space-between; gap: 12px; text-align: left;
    font: 400 15px/1.3 "Golos Text", system-ui, sans-serif; color: var(--ink);
  }
  .log button:hover { background: #EDF1F7; }
  .log .id { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log .empty { color: var(--muted); font-size: 15px; padding: 10px 0; }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; gap: 28px; padding-top: 20px; }
    .preview { position: static; order: -1; }
    header.top { order: -2; }
    .preview canvas { max-width: 360px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Бухоро семинари</h1>
      <p>2 ноябрь, 2026 · билет яратиш</p>
    </div>
    <div class="counter">Бу қурилмада яратилди: <b id="count">0</b></div>
  </header>

  <section>
    <form id="form" novalidate>
      <div class="field">
        <label for="name">Исм ва фамилия</label>
        <input id="name" name="name" autocomplete="off" autocapitalize="words" placeholder="Масалан, Азиз Каримов" required>
      </div>
      <div class="field">
        <label for="phone">Телефон рақам</label>
        <div class="phone">
          <span>+998</span>
          <input id="phone" name="phone" inputmode="numeric" autocomplete="off" placeholder="90 123 45 67" required>
        </div>
        <div class="hint">Битта рақамга битта билет. Рақам аввал ёзилган бўлса, ўша билет қайта очилади.</div>
      </div>
      <button class="primary" id="submit" type="submit">Билет яратиш</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="actions" id="actions">
      <button class="ghost" id="download" type="button">Юклаб олиш</button>
      <button class="ghost" id="share" type="button">Улашиш</button>
      <button class="primary wide" id="next" type="button">Кейинги иштирокчи</button>
    </div>

    <div class="log">
      <h2>Охирги билетлар</h2>
      <ol id="log"></ol>
    </div>
  </section>

  <section class="preview" aria-label="Билет кўриниши">
    <canvas id="ticket" width="1080" height="1350"></canvas>
  </section>
</main>

<script>
/* ============ СОЗЛАМАЛАР — фақат шу ерни ўзгартиринг ============ */
const CONFIG = {
  // Google Apps Script → Deploy → Web app манзили (…/exec)
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzq27ly408WCqcGoqihqlEqGJoI4xJXTEGKi0RFqy7jMYhoVKOtU1Q9D3zx1ZBAlqsz/exec',
  REGION: 'Бухоро',
  TITLE: 'Бепул семинар',
  SPEAKER: 'Илҳом Бегимқулов',
  DATE: '2 ноябрь, 2026',
  TIME: '10:00',
  PLACE: 'Бухоро шаҳри',
  BRAND: 'Real Business Academy'
};
/* ================================================================ */

const $ = (id) => document.getElementById(id);
const form = $('form'), nameEl = $('name'), phoneEl = $('phone');
const statusEl = $('status'), actions = $('actions'), submitBtn = $('submit');
const canvas = $('ticket'), ctx = canvas.getContext('2d');
let current = null; // {ticketId, name, phone}

/* ---------- телефон ---------- */
function digits(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (d.startsWith('998') && d.length > 9) d = d.slice(3);
  return d.slice(0, 9);
}
function fmtLocal(d) { // 901234567 → 90 123 45 67
  return [d.slice(0,2), d.slice(2,5), d.slice(5,7), d.slice(7,9)].filter(Boolean).join(' ');
}
function masked(full) { // +998901234567 → +998 90 *** ** 67
  const d = digits(full);
  return d.length === 9 ? `+998 ${d.slice(0,2)} *** ** ${d.slice(7)}` : '+998 ·· ··· ·· ··';
}
phoneEl.addEventListener('input', () => {
  phoneEl.value = fmtLocal(digits(phoneEl.value));
  if (!current) draw();
});
nameEl.addEventListener('input', () => { if (!current) draw(); });

/* ---------- билет чизиш ---------- */
const W = 1080, H = 1350;
function star(x, y, r) {
  ctx.beginPath(); ctx.rect(x - r, y - r, 2*r, 2*r);
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI/4);
  ctx.rect(-r, -r, 2*r, 2*r); ctx.restore();
  ctx.stroke();
}
function pattern(y0, h) {
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y0, W, h); ctx.clip();
  ctx.strokeStyle = 'rgba(63,169,163,.55)'; ctx.lineWidth = 2;
  const s = 90;
  for (let row = -1; row * s < h + s; row++) {
    for (let col = -1; col * s < W + s; col++) {
      const off = row % 2 ? s/2 : 0;
      star(col*s + off, y0 + row*s + s/2, 26);
    }
  }
  ctx.restore();
}
function fitText(text, maxW, start, min, weight, family) {
  let size = start;
  do { ctx.font = `${weight} ${size}px ${family}`; size -= 2; }
  while (ctx.measureText(text).width > maxW && size > min);
  return size + 2;
}
function wrapName(text, maxW) {
  const words = text.split(/\s+/).filter(Boolean);
  if (words.length < 2) return [text];
  // энг тенг иккига бўлиш
  let best = [text], bestW = Infinity;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0,i).join(' '), b = words.slice(i).join(' ');
    const w = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
    if (w < bestW) { bestW = w; best = [a, b]; }
  }
  return ctx.measureText(text).width > maxW ? best : [text];
}

function draw() {
  const name = (current ? current.name : nameEl.value.trim()) || 'Исм Фамилия';
  const phone = current ? current.phone : '+998' + digits(phoneEl.value);
  const id = current ? current.ticketId : 'BX-2026-····';
  const pad = 80;

  // фон
  ctx.fillStyle = '#1D3F7A'; ctx.fillRect(0, 0, W, H);
  pattern(0, 250);
  const g = ctx.createLinearGradient(0, 120, 0, 250);
  g.addColorStop(0, 'rgba(29,63,122,0)'); g.addColorStop(1, '#1D3F7A');
  ctx.fillStyle = g; ctx.fillRect(0, 120, W, 130);

  // сарлавҳа
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.fillStyle = '#C9A06B';
  ctx.font = '600 34px "Golos Text", system-ui, sans-serif';
  ctx.fillText(CONFIG.TITLE, pad, 320);
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '700 52px "Unbounded", system-ui, sans-serif';
  ctx.fillText(CONFIG.SPEAKER, pad, 390);

  // иштирокчи
  ctx.fillStyle = 'rgba(255,255,255,.6)';
  ctx.font = '500 30px "Golos Text", system-ui, sans-serif';
  ctx.fillText('Иштирокчи', pad, 520);
  ctx.fillStyle = '#FFFFFF';
  const maxW = W - pad*2;
  let size = 84;
  ctx.font = `700 ${size}px "Unbounded", system-ui, sans-serif`;
  let lines = wrapName(name, maxW);
  size = Math.min(...lines.map(l => fitText(l, maxW, 84, 40, 700, '"Unbounded", system-ui, sans-serif')));
  ctx.font = `700 ${size}px "Unbounded", system-ui, sans-serif`;
  lines.forEach((l, i) => ctx.fillText(l, pad, 610 + i * size * 1.18));

  // маълумот
  const infoY = 860;
  const cols = [['Сана', CONFIG.DATE], ['Вақт', CONFIG.TIME], ['Жой', CONFIG.PLACE]];
  const colW = maxW / 3;
  cols.forEach(([k, v], i) => {
    const x = pad + i * colW;
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '500 28px "Golos Text", system-ui, sans-serif';
    ctx.fillText(k, x, infoY);
    ctx.fillStyle = '#FFFFFF';
    fitText(v, colW - 24, 36, 22, 600, '"Golos Text", system-ui, sans-serif');
    ctx.fillText(v, x, infoY + 48);
  });

  // йиртиладиган чизиқ
  const cutY = 1010;
  ctx.fillStyle = '#F5F7FA';
  ctx.beginPath(); ctx.arc(0, cutY, 34, 0, Math.PI*2); ctx.arc(W, cutY, 34, 0, Math.PI*2); ctx.fill();
  ctx.save(); ctx.setLineDash([14, 14]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(60, cutY); ctx.lineTo(W - 60, cutY); ctx.stroke(); ctx.restore();

  // корешок
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '500 28px "Golos Text", system-ui, sans-serif';
  ctx.fillText('Билет рақами', pad, 1110);
  ctx.fillStyle = '#C9A06B'; ctx.font = '700 76px "Unbounded", system-ui, sans-serif';
  ctx.fillText(id, pad, 1205);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = '500 30px "Golos Text", system-ui, sans-serif';
  ctx.fillText(masked(phone), pad, 1265);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '500 26px "Golos Text", system-ui, sans-serif';
  ctx.fillText(CONFIG.BRAND, W - pad, 1265);
  ctx.textAlign = 'left';
}

/* ---------- ҳолат ---------- */
function setStatus(text, kind) { statusEl.textContent = text; statusEl.className = 'status ' + (kind || ''); }
function fileName() { return (current ? current.ticketId : 'bilet') + '.png'; }
function toBlob() { return new Promise(r => canvas.toBlob(r, 'image/png')); }

/* ---------- журнал (фақат шу қурилмада) ---------- */
const LOG_KEY = 'bx-tickets';
function readLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch { return []; } }
function writeLog(list) { try { localStorage.setItem(LOG_KEY, JSON.stringify(list.slice(0, 200))); } catch {} }
function addLog(t) {
  const list = readLog().filter(x => x.ticketId !== t.ticketId);
  list.unshift({ ticketId: t.ticketId, name: t.name, phone: t.phone });
  writeLog(list); renderLog();
}
function renderLog() {
  const list = readLog(), ol = $('log');
  $('count').textContent = list.length;
  ol.innerHTML = '';
  if (!list.length) { ol.innerHTML = '<li class="empty">Ҳали билет яратилмади.</li>'; return; }
  list.slice(0, 12).forEach(t => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button';
    const n = document.createElement('span'); n.textContent = t.name;
    const i = document.createElement('span'); i.className = 'id'; i.textContent = t.ticketId;
    b.append(n, i);
    b.onclick = () => { current = t; draw(); actions.classList.add('show'); setStatus('Билет қайта очилди: ' + t.ticketId, 'ok'); };
    li.append(b); ol.append(li);
  });
}

/* ---------- юбориш ---------- */
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = nameEl.value.trim().replace(/\s+/g, ' ');
  const d = digits(phoneEl.value);
  if (name.split(' ').length < 2) { setStatus('Исм ва фамилияни тўлиқ ёзинг.', 'err'); nameEl.focus(); return; }
  if (d.length !== 9) { setStatus('Телефон рақам 9 та рақамдан иборат бўлиши керак.', 'err'); phoneEl.focus(); return; }
  if (!/^https:\/\/script\.google\.com\//.test(CONFIG.SCRIPT_URL)) {
    setStatus('Apps Script манзили қўйилмаган: index.html ичидаги SCRIPT_URL ни тўлдиринг.', 'err'); return;
  }

  submitBtn.disabled = true; submitBtn.textContent = 'Яратилмоқда…'; setStatus('');
  try {
    const res = await fetch(CONFIG.SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS preflight бўлмаслиги учун
      body: JSON.stringify({ name, phone: '+998' + d, region: CONFIG.REGION })
    });
    const data = await res.json();
    if (data.status === 'created' || data.status === 'exists') {
      current = { ticketId: data.ticketId, name: data.name, phone: data.phone };
      draw(); addLog(current);
      actions.classList.add('show');
      setStatus(data.status === 'created'
        ? 'Билет яратилди ва жадвалга ёзилди: ' + data.ticketId
        : 'Бу рақамда билет бор эди — ўша билет очилди: ' + data.ticketId,
        data.status === 'created' ? 'ok' : 'warn');
    } else {
      setStatus('Жадвал хато қайтарди: ' + (data.message || 'номаълум хато'), 'err');
    }
  } catch (err) {
    setStatus('Жадвалга уланиб бўлмади. Интернетни ва SCRIPT_URL ни текширинг.', 'err');
  } finally {
    submitBtn.disabled = false; submitBtn.textContent = 'Билет яратиш';
  }
});

$('download').onclick = async () => {
  const blob = await toBlob(), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fileName();
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('share').onclick = async () => {
  const blob = await toBlob();
  const file = new File([blob], fileName(), { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Билет ' + current.ticketId }); } catch {}
  } else {
    setStatus('Бу браузер улашишни қўлламайди — «Юклаб олиш» тугмасидан фойдаланинг.', 'warn');
  }
};
$('next').onclick = () => {
  current = null; form.reset(); actions.classList.remove('show'); setStatus(''); draw(); nameEl.focus();
};

/* ---------- бошлаш ---------- */
renderLog();
draw();
Promise.all([
  document.fonts.load('700 40px "Unbounded", system-ui, sans-serif'),
  document.fonts.load('500 30px "Golos Text", system-ui, sans-serif'),
  document.fonts.load('600 30px "Golos Text", system-ui, sans-serif')
]).then(draw, draw);
document.fonts.ready.then(draw);
</script>
</body>
</html>
